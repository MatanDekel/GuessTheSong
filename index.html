<style>
:root{
  --bg:#F2ECFB; --ink:#1E1030; --muted:#6B5A82; --surface:#FFFFFF; --line:#DCD0EE;
  --pink:#FF2E88; --cyan:#12B5D9; --yellow:#FFC93C; --btn:#1E1030; --btn-ink:#FFFFFF;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1A0B26; --ink:#F6EEFF; --muted:#B9A6D2; --surface:#2A1640; --line:#3E2758;
    --btn:#F6EEFF; --btn-ink:#1A0B26; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A0B26; --ink:#F6EEFF; --muted:#B9A6D2; --surface:#2A1640; --line:#3E2758;
  --btn:#F6EEFF; --btn-ink:#1A0B26; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  display:flex;flex-direction:column;align-items:center;
  -webkit-tap-highlight-color:transparent;
}
header{width:100%;max-width:440px;padding:18px 20px 6px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:52px;height:52px;border-radius:14px;flex:none;box-shadow:0 4px 14px rgba(26,11,38,.25);transition:width .25s,height .25s}
body.on-menu .logo{width:72px;height:72px;border-radius:18px}
h1{font-family:"Secular One","Rubik",sans-serif;font-weight:400;font-size:1.6rem;line-height:1.1;margin:0}
h1 small{display:block;font-family:"Rubik",sans-serif;font-size:.85rem;color:var(--muted);font-weight:500;margin-top:2px}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500;white-space:nowrap}
main{width:100%;max-width:440px;padding:10px 20px 20px;flex:1;display:flex;flex-direction:column;gap:16px}
[hidden]{display:none!important}

/* category menu */
.menu{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.cat{
  display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:start;
  background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:22px;
  padding:18px 20px;font:inherit;cursor:pointer;
}
.cat:active{transform:scale(.98)}
.cat b{display:block;font-family:"Secular One","Rubik",sans-serif;font-weight:400;font-size:1.3rem;line-height:1.2}
.cat span{display:block;color:var(--muted);font-size:.9rem;margin-top:3px;line-height:1.4}
.cat i{font-style:normal;flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:1.3rem;background:var(--c)}
.cat em{font-style:normal;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}

.stage{perspective:1400px;touch-action:pan-y;user-select:none}
.card{
  position:relative;width:100%;aspect-ratio:3/4;max-height:58vh;margin-inline:auto;
  transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.8,.2,1);cursor:pointer;
}
.card.flipped{transform:rotateY(180deg)}
.card.swipe-out-next{transition:transform .25s ease-in,opacity .25s;transform:translateX(-120%) rotate(-8deg);opacity:0}
.card.swipe-out-prev{transition:transform .25s ease-in,opacity .25s;transform:translateX(120%) rotate(8deg);opacity:0}
.face{
  position:absolute;inset:0;border-radius:28px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;overflow:hidden;
}
.front{background:var(--surface);border:2px solid var(--line)}
.disc{
  width:62%;aspect-ratio:1;border-radius:50%;position:relative;
  background:
    radial-gradient(circle,var(--surface) 0 12%,transparent 12.5%),
    radial-gradient(circle,var(--disc,var(--pink)) 0 30%,transparent 30.5%),
    repeating-radial-gradient(circle,#2a1a3c 0 2px,#3b2752 2px 4px);
  box-shadow:0 0 0 6px var(--yellow),0 0 0 12px var(--cyan);
}
.playing .disc{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.front p{color:var(--muted);margin:26px 0 0;font-size:.95rem;line-height:1.5;max-width:26ch}

.back{transform:rotateY(180deg);color:#1E1030;background:var(--yr,#FFC93C)}
.back .year{font-family:"Secular One","Rubik",sans-serif;font-size:clamp(5rem,30vw,8.5rem);line-height:.9;letter-spacing:-.02em}
.back .artist{font-weight:700;font-size:1.4rem;margin-top:22px;line-height:1.2}
.back .song{font-size:1.15rem;margin-top:8px;line-height:1.3}
.back .extra{font-size:.95rem;margin-top:10px;line-height:1.3;opacity:.75}

.play{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  background:#1DB954;color:#0B2414;border:0;border-radius:999px;padding:16px 20px;
  font:700 1.1rem "Rubik",sans-serif;cursor:pointer;text-decoration:none;
}
.play svg{width:22px;height:22px}
.row{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px}
.btn{
  border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:16px;
  padding:13px 8px;font:500 1rem "Rubik",sans-serif;cursor:pointer;
}
.btn.solid{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn:disabled{opacity:.35;cursor:default}
button:focus-visible,a:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.hint{color:var(--muted);font-size:.85rem;text-align:center;margin:0;line-height:1.5}
.tools{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 16px}
.link{background:none;border:0;color:var(--muted);font:500 .9rem "Rubik",sans-serif;text-decoration:underline;cursor:pointer;padding:6px}
.copied{color:var(--pink)}
.spbar{display:none}
body.on-menu .spbar{display:block}
.spbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:transparent;color:var(--ink);border:2px solid #1DB954;border-radius:999px;padding:13px 16px;font:700 1rem "Rubik",sans-serif;cursor:pointer}
.spbtn svg{width:24px;height:24px;flex:none}
.spon{margin:0;text-align:center;color:var(--muted);font-weight:500;font-size:.95rem}
.spon .link{font-size:.9rem}
.status{color:var(--ink);font-weight:500}
#spConnect{color:var(--ink);font-weight:700}
#clip{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
@media (prefers-reduced-motion:reduce){.card,.card.swipe-out-next,.card.swipe-out-prev{transition:none}.playing .disc{animation:none}}
</style>

      <button class="link" id="menuBtn">החלף קטגוריה</button>
      <button class="link" id="copy">הקישור לא נפתח? העתק לחיפוש</button>
      <button class="link" id="shuffle">ערבב מחדש</button>
      <button class="link" id="spCheck" hidden>בדוק שירים בספוטיפיי</button>
      <button class="link" id="spLogout" hidden>התנתק מספוטיפיי</button>
    </div>
    <div id="checkPanel" hidden style="display:flex;flex-direction:column;gap:8px">

    </div>
    <input id="clip" aria-hidden="true" tabindex="-1" readonly>
  </section>
</main>

const CATS = [
  {id:"boys",  name:"להקות בנים",   range:"2008–2015", icon:"🕺", color:"#7FE0F2", songs:kp.filter(x=>x.t==="b")},
  {id:"girls", name:"להקות בנות",   range:"2008–2015", icon:"💃", color:"#FF8FB8", songs:kp.filter(x=>x.t==="g")},
  {id:"mixed", name:"מעורבב",       range:"2008–2015", icon:"🎤", color:"#FFC93C", songs:kp.filter(x=>x.t!=="x")},
  {id:"eden",  name:"האהובות של עדן", range:"B.A.P · 2PM · FT Island · BEAST · B1A4 · Super Junior · DAY6, כל השנים", icon:"💜", color:"#C3A6FF", songs:kp.filter(x=>FAVS.includes(x.a))},
  {id:"anime", name:"פתיחות וסיומים של אנימה", range:"כל הזמנים", icon:"🌸", color:"#9BE88E", songs:ANIME.map(([a,s,y,x])=>({a,s,y,x}))},
  {id:"shonen", name:"אנימה שונן", range:"2015 עד היום", icon:"🔥", color:"#FF9A5C", songs:SHONEN.map(([a,s,y,x])=>({a,s,y,x}))},
  {id:"disneyFilms", name:"דיסני מצויר", range:"שירים מסרטי דיסני ופיקסאר", icon:"🏰", color:"#7FE0F2", songs:DISNEY_FILMS.map(([a,s,y,x])=>({a,s,y,x}))},
  {id:"disneyStars", name:"כוכבי דיסני", range:"אמנים שיצאו מדיסני", icon:"⭐", color:"#FFE066", songs:DISNEY_STARS.map(([a,s,y,x])=>({a,s,y,x}))}
];

const $=id=>document.getElementById(id);
const card=$("card");
let cat=null,deck=[],i=0;

function yearColor(y){
  const fixed={2008:"#FFC93C",2009:"#FF8FB8",2010:"#7FE0F2",2011:"#C3A6FF",2012:"#FF9A5C",2013:"#9BE88E",2014:"#FFE066",2015:"#FF6FA8"};
  return fixed[y]||`hsl(${(y*53)%360} 85% 74%)`;
}
function store(){try{localStorage.setItem("kh-"+cat.id,JSON.stringify({deck,i}))}catch(e){}}
function shuffle(){
  deck=cat.songs.map((s,n)=>n);
  for(let k=deck.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[deck[k],deck[j]]=[deck[j],deck[k]]}
  i=0;card.dataset.ready="";render();store();
}
function buildMenu(){
  $("menu").innerHTML="";
  CATS.forEach(c=>{
    const b=document.createElement("button");
    b.className="cat";b.style.setProperty("--c",c.color);
    b.innerHTML=`<i aria-hidden="true">${c.icon}</i><div style="flex:1"><b></b><span></span></div><em>${c.songs.length} שירים</em>`;
    b.querySelector("b").textContent=c.name;b.querySelector("span").textContent=c.range;
    b.onclick=()=>open(c);
    $("menu").appendChild(b);
  });
}
function showMenu(){
  cat=null;$("menu").hidden=false;$("game").hidden=true;document.body.classList.add("on-menu");
  $("title").firstChild.textContent="היטסטר";$("sub").textContent="בחרו קטגוריה";$("count").textContent="";
  try{localStorage.removeItem("kh-last")}catch(e){}
}
function open(c){
  cat=c;$("menu").hidden=true;$("game").hidden=false;document.body.classList.remove("on-menu");
  $("title").firstChild.textContent=c.name;$("sub").textContent=c.range;
  card.style.setProperty("--disc",c.color);
  try{localStorage.setItem("kh-last",c.id)}catch(e){}
  try{
    const s=JSON.parse(localStorage.getItem("kh-"+c.id)||"null");
    if(s&&Array.isArray(s.deck)&&s.deck.length===c.songs.length){deck=s.deck;i=Math.min(s.i||0,deck.length-1);card.dataset.ready="";render();return}
  }catch(e){}
  shuffle();
}
function render(){
  const t=cat.songs[deck[i]];
  card.classList.remove("flipped","playing");
  setTimeout(()=>{
    $("year").textContent=t.y;$("artist").textContent=t.a;$("song").textContent=t.s;$("extra").textContent=t.x||"";
    $("back").style.setProperty("--yr",yearColor(t.y));
  },card.dataset.ready?300:0);
  card.dataset.ready="1";
  $("play").href=$("spFallback").href="https://open.spotify.com/search/"+encodeURIComponent(t.a+" "+t.s);
  if(typeof spTok==="function"){spStatus("");if(spTok())$("playLabel").textContent="נגן"}
  $("count").textContent=`${i+1} / ${deck.length}`;
  $("prev").disabled=i===0;$("next").disabled=i===deck.length-1;
  $("flip").textContent="גלה";
}
function flip(){
  card.classList.toggle("flipped");
  $("flip").textContent=card.classList.contains("flipped")?"הסתר":"גלה";
}
function go(dir){
  const n=i+dir;if(n<0||n>=deck.length)return;
  card.classList.add(dir>0?"swipe-out-next":"swipe-out-prev");
  setTimeout(()=>{card.classList.remove("swipe-out-next","swipe-out-prev");i=n;render();store()},220);
}
async function copyQuery(){
  const t=cat.songs[deck[i]],q=t.a+" "+t.s,b=$("copy");
  let ok=false;
  try{await navigator.clipboard.writeText(q);ok=true}catch(e){}
  if(!ok){try{const c=$("clip");c.value=q;c.select();ok=document.execCommand("copy")}catch(e){}}
  b.textContent=ok?"הועתק, הדביקו בחיפוש של ספוטיפיי":"ההעתקה נחסמה בדפדפן הזה";
  b.classList.add("copied");
  setTimeout(()=>{b.textContent="הקישור לא נפתח? העתק לחיפוש";b.classList.remove("copied")},2500);
  card.classList.add("playing");
}


// ---- Spotify: play in the background on the user's active device ----
const SP_CLIENT="8b76dc5f391c4df2b6339962fc790474";
const SP_REDIRECT=location.origin+"/";
const SP_SCOPES="user-modify-playback-state user-read-playback-state";
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const b64url=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
function spTok(){try{return JSON.parse(ls.get("sp-token")||"null")}catch(e){return null}}
function spSave(d){
  const t={access:d.access_token,refresh:d.refresh_token||(spTok()||{}).refresh,exp:Date.now()+(d.expires_in-60)*1000};
  ls.set("sp-token",JSON.stringify(t));return t;
}
async function spLogin(){
  const v=b64url(crypto.getRandomValues(new Uint8Array(48)));
  ls.set("sp-verifier",v);
  const ch=b64url(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)));
  const p=new URLSearchParams({client_id:SP_CLIENT,response_type:"code",redirect_uri:SP_REDIRECT,scope:SP_SCOPES,code_challenge_method:"S256",code_challenge:ch});
  location.href="https://accounts.spotify.com/authorize?"+p;
}
async function spTokenReq(body){
  const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:SP_CLIENT,...body})});
  if(!r.ok)throw new Error("token");
  return spSave(await r.json());
}
async function spHandleRedirect(){
  const q=new URLSearchParams(location.search);
  if(!q.has("code")&&!q.has("error"))return;
  history.replaceState(null,"",location.pathname);
  if(q.has("error")){spStatus("ההתחברות לספוטיפיי בוטלה.");return}
  try{
    await spTokenReq({grant_type:"authorization_code",code:q.get("code"),redirect_uri:SP_REDIRECT,code_verifier:ls.get("sp-verifier")||""});
    spStatus("מחובר לספוטיפיי. לחיצה על נגן תפעיל את השיר ברקע.");
  }catch(e){spStatus("ההתחברות לספוטיפיי נכשלה. נסו שוב.")}
  ls.del("sp-verifier");
}
async function spAccess(){
  let t=spTok();if(!t)return null;
  if(Date.now()>t.exp){
    try{t=await spTokenReq({grant_type:"refresh_token",refresh_token:t.refresh})}
    catch(e){ls.del("sp-token");spUI();return null}
  }
  return t.access;
}
async function sp(path,opts={}){
  const a=await spAccess();if(!a)throw {status:401};
  const r=await fetch("https://api.spotify.com/v1"+path,{...opts,headers:{Authorization:"Bearer "+a,"Content-Type":"application/json"}});
  if(r.status===204||r.status===202)return null;
  const d=await r.json().catch(()=>null);
  if(!r.ok)throw {status:r.status,reason:d&&d.error&&d.error.reason};
  return d;
}
const spNorm=x=>(x||"").toLowerCase().normalize("NFKD").replace(/[^a-z0-9\u3040-\u30ff\u4e00-\u9fff\uac00-\ud7af]/g,"");
function spArtistOk(item,t){
  const want=t.a.split(/,| feat\. | & | × |:/).map(spNorm).filter(Boolean);
  return item.artists.some(ar=>{const n=spNorm(ar.name);return n&&want.some(w=>n.includes(w)||w.includes(n))});
}
async function spSearch(t){
  const clean=x=>x.replace(/["']/g,"");
  const mainArtist=t.a.split(/,| feat\. | & | × /)[0];
  const qs=[`track:${clean(t.s)} artist:${clean(mainArtist)}`,`${mainArtist} ${t.s}`,`${t.s}`];
  let first=null;
  for(const q of qs){
    const d=await sp("/search?type=track&limit=5&q="+encodeURIComponent(q));
    const items=(d&&d.tracks&&d.tracks.items)||[];
    const hit=items.find(it=>spArtistOk(it,t));
    if(hit)return {item:hit,exact:true};
    if(!first&&items[0])first=items[0];
  }
  return first?{item:first,exact:false}:null;
}
async function spFind(t){
  const key="sp-uri2:"+t.a+"|"+t.s;const c=ls.get(key);if(c)return c;
  const r=await spSearch(t);
  if(r){ls.set(key,r.item.uri);return r.item.uri}
  return null;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function spCheckAll(){
  if(!confirm("לבדוק את כל השירים מול ספוטיפיי? זה לוקח כמה דקות."))return;
  const seen=new Set(),all=[];
  CATS.forEach(c=>c.songs.forEach(t=>{const k=t.a+"|"+t.s;if(!seen.has(k)){seen.add(k);all.push(t)}}));
  const missing=[],diff=[];
  for(let n=0;n<all.length;n++){
    const t=all[n];
    spStatus(`בודק ${n+1} מתוך ${all.length}…`);
    let r=null;
    for(let tries=0;tries<4;tries++){
      try{r=await spSearch(t);break}
      catch(e){if(e.status===429){await sleep(5000)}else if(e.status===401){spStatus("צריך להתחבר שוב לספוטיפיי.");return}else break}
    }
    if(!r)missing.push(`${t.a} – ${t.s} (${t.y})`);
    else{
      ls.set("sp-uri2:"+t.a+"|"+t.s,r.item.uri);
      if(!r.exact)diff.push(`${t.a} – ${t.s} (${t.y})  →  בספוטיפיי: ${r.item.artists.map(a=>a.name).join(", ")} – ${r.item.name}`);
    }
    await sleep(120);
  }
  const out=[`נבדקו ${all.length} שירים.`,"",`לא נמצאו (${missing.length}):`,...missing,"",`נמצאו אצל אמן אחר, כדאי לוודא (${diff.length}):`,...diff].join("\n");
  $("checkOut").value=out;$("checkPanel").hidden=false;
  spStatus(missing.length||diff.length?"הבדיקה הסתיימה. העתיקו את הרשימה ושלחו אותה לתיקון.":"הבדיקה הסתיימה: כל השירים נמצאו.");
}
async function spPlay(t){
  spStatus("מחפש את השיר…");
  const uri=await spFind(t);
  if(!uri){spStatus("לא מצאתי את השיר בספוטיפיי.",true);return}
  const body=JSON.stringify({uris:[uri]});
  try{await sp("/me/player/play",{method:"PUT",body})}
  catch(e){
    if(e.status!==404)throw e;
    const d=await sp("/me/player/devices");
    const devs=(d&&d.devices)||[];
    const dev=devs.find(x=>x.type==="Smartphone")||devs[0];
    if(!dev){spStatus("ספוטיפיי לא פעיל באף מכשיר. פתחו את האפליקציה, הפעילו משהו לשנייה וחזרו לכאן.",true);return}
    await sp("/me/player/play?device_id="+dev.id,{method:"PUT",body});
  }
  card.classList.add("playing");
  $("playLabel").textContent="עצור";
  spStatus("");
}
async function spPause(){
  try{await sp("/me/player/pause",{method:"PUT"})}catch(e){}
  card.classList.remove("playing");$("playLabel").textContent="נגן";
}
function spStatus(msg,showLink){const el=$("spStatus");el.textContent=msg||"";el.hidden=!msg;$("spFallback").hidden=!showLink}
function spUI(){
  const on=!!spTok();
  $("spConnect").hidden=on;$("spConnect2").hidden=on;$("spOn").hidden=!on;$("spLogout").hidden=!on;$("copy").hidden=on;$("spCheck").hidden=!on;
  $("playLabel").textContent=on?(card.classList.contains("playing")?"עצור":"נגן"):"נגן בספוטיפיי";
}
$("spConnect").onclick=spLogin;$("spConnect2").onclick=spLogin;
$("spLogout2").onclick=()=>{ls.del("sp-token");spStatus("");spUI()};
$("spCheck").onclick=spCheckAll;
$("checkCopy").onclick=async()=>{const v=$("checkOut").value;try{await navigator.clipboard.writeText(v)}catch(e){$("checkOut").select();document.execCommand("copy")}$("checkCopy").textContent="הועתק"};
$("spLogout").onclick=()=>{ls.del("sp-token");spStatus("");spUI()};

let swiped=false;
card.addEventListener("click",()=>{if(swiped)return;flip()});
card.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip()}});
$("flip").onclick=flip;
$("play").addEventListener("click",async e=>{
  if(!spTok()){card.classList.add("playing");return}
  e.preventDefault();
  if(card.classList.contains("playing")){spPause();return}
  try{await spPlay(cat.songs[deck[i]])}
  catch(err){
    if(err.status===403)spStatus("ספוטיפיי חסמו את הניגון: צריך חשבון Premium, והמשתמש צריך להיות רשום ב־User Management של האפליקציה.",true);
    else if(err.status===401){ls.del("sp-token");spUI();spStatus("צריך להתחבר שוב לספוטיפיי.")}
    else spStatus("הניגון לא הצליח.",true);
  }
});
$("copy").onclick=copyQuery;
$("next").onclick=()=>go(1);$("prev").onclick=()=>go(-1);
$("menuBtn").onclick=showMenu;
$("shuffle").onclick=()=>{if(confirm("לערבב את החפיסה מחדש ולהתחיל מההתחלה?"))shuffle()};
document.addEventListener("keydown",e=>{if(!cat)return;if(e.key==="ArrowLeft")go(1);if(e.key==="ArrowRight")go(-1)});

let sx=null,sy=null;
$("stage").addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$("stage").addEventListener("touchend",e=>{
  if(sx===null)return;
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){swiped=true;go(dx<0?1:-1);setTimeout(()=>swiped=false,350)}
  sx=sy=null;
});

buildMenu();
spUI();
spHandleRedirect().then(spUI);
let last=null;try{last=localStorage.getItem("kh-last")}catch(e){}
const lc=CATS.find(c=>c.id===last);
if(lc)open(lc);else showMenu();
